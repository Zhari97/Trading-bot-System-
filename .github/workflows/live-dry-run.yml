name: Live Dry Run

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run full live-path dry run
        env:
          TELEGRAM_BOT_TOKEN: ''
          TELEGRAM_CHAT_ID: ''
          DASHBOARD_URL: ''
          DASHBOARD_INGEST_TOKEN: ''
        run: python live_dry_run.py

name: Controllo Segnale Crypto

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modalita_test:
        description: "Invia un messaggio di test su Telegram invece di analizzare i segnali"
        required: true
        default: false
        type: boolean

concurrency:
  group: controllo-segnale-crypto
  cancel-in-progress: false

jobs:
  controlla-segnale:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v6

      - name: Imposta Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Scopri universo crypto dinamico
        env:
          CRYPTO_TOP_N: 10
          DYNAMIC_CRYPTO_UNIVERSE: 1
        run: |
          PAIRS=$(python -c "from market_universe import discover_crypto_pairs; print(','.join(discover_crypto_pairs()))")
          echo "PAIRS=$PAIRS" >> "$GITHUB_ENV"
          echo "Universo crypto: $PAIRS"

      - name: Esegui il controllo del segnale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          INTERVAL_MIN: 15
          MODALITA_TEST: ${{ inputs.modalita_test && '1' || '0' }}
        run: python segnale_crypto_binance.py

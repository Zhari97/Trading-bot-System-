name: Controllo Segnale Crypto

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      modalita_test:
        description: "Invia un messaggio di test su Telegram invece di analizzare i segnali"
        required: true
        default: false
        type: boolean

concurrency:
  group: controllo-segnale-crypto
  cancel-in-progress: false

jobs:
  controlla-segnale:
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice del repository
        uses: actions/checkout@v6

      - name: Imposta Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Installa le dipendenze
        run: python -m pip install -r requirements.txt

      - name: Esegui test automatici
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Prepara chiave cache universo crypto
        id: crypto-cache-key
        run: echo "key=crypto-universe-v1-$(date -u +%Y%m%d%H)" >> "$GITHUB_OUTPUT"

      - name: Ripristina cache universo crypto
        uses: actions/cache@v4
        with:
          path: .cache/crypto_universe.json
          key: ${{ steps.crypto-cache-key.outputs.key }}
          restore-keys: |
            crypto-universe-v1-

      - name: Scopri universo crypto dinamico con cache
        env:
          CRYPTO_TOP_N: 10
          DYNAMIC_CRYPTO_UNIVERSE: 1
          CRYPTO_UNIVERSE_CACHE: .cache/crypto_universe.json
          CRYPTO_UNIVERSE_CACHE_TTL: 3600
        run: |
          PAIRS=$(python crypto_universe_cache.py)
          echo "PAIRS=$PAIRS" >> "$GITHUB_ENV"
          echo "Universo crypto: $PAIRS"

      - name: Esegui il controllo del segnale
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: ${{ vars.DASHBOARD_URL }}
          DASHBOARD_INGEST_TOKEN: ${{ secrets.DASHBOARD_INGEST_TOKEN }}
          INTERVAL_MIN: 15
          MODALITA_TEST: ${{ inputs.modalita_test && '1' || '0' }}
        run: python run_signal_guard.py

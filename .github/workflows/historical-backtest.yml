name: Historical Backtest

on:
  push:
    paths:
      - 'signal_engine.py'
      - 'trade_plan.py'
      - 'historical_*.py'
      - 'research_*.py'
      - 'signal_engine_replay_adapter_fast.py'
      - '.github/workflows/historical-backtest.yml'
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip requests
      - name: Run six-month replay
        run: python historical_engine_runner.py
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: backtest_results.json
          retention-days: 30

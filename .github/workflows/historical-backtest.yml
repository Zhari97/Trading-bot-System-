name: Historical Backtest

on:
  push:
    paths:
      - 'signal_engine.py'
      - 'trade_plan.py'
      - 'historical_*.py'
      - 'research_*.py'
      - 'trade_journal.py'
      - 'position_allocator.py'
      - 'cost_model.py'
      - 'regime_analysis.py'
      - 'monte_carlo.py'
      - 'signal_engine_replay_adapter*.py'
      - 'tests/**'
      - '.github/workflows/historical-backtest.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Compile all Python files
        run: python -m compileall -q .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  backtest:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip -r requirements.txt
      - name: Run six-month replay
        run: python historical_engine_runner.py
      - name: Validate result file
        run: python -m json.tool backtest_results.json >/dev/null
      - name: Publish research results
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const content = fs.readFileSync('backtest_results.json');
            const encoded = content.toString('base64');
            const path = 'backtest_results.json';
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: context.ref.replace('refs/heads/', '')
              });
              sha = current.data.sha;
            } catch (e) {
              if (e.status !== 404) throw e;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              message: 'chore: publish latest research results',
              content: encoded,
              branch: context.ref.replace('refs/heads/', ''),
              ...(sha ? { sha } : {})
            });
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: historical-backtest-results
          path: backtest_results.json
          retention-days: 30
